<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #14101f;
    --ink-2: #1c1730;
    --parchment: #f4ead9;
    --parchment-2: #ece0ca;
    --gold: #c9a15a;
    --gold-bright: #e3c483;
    --wine: #7c2d42;
    --text-ink: #241a32;
    --text-dim-ink: #6b5f5a;
    --text-cream: #efe7f5;
    --text-dim-cream: #a89bc2;
    --danger: #a5334a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background:
      radial-gradient(1.5px 1.5px at 20% 15%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 75% 40%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 90% 85%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1.5px 1.5px at 10% 90%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1.5px 1.5px at 35% 30%, rgba(255,255,255,0.15), transparent),
      radial-gradient(ellipse at top, #241d3d, var(--ink) 55%);
    background-attachment: fixed;
    color: var(--text-cream);
    min-height: 100vh;
    padding-bottom: 60px;
  }
  a { color: var(--gold-bright); text-decoration: none; }
  .icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; vertical-align: -3px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid rgba(201,161,90,0.18);
    position: sticky; top: 0; background: rgba(20,16,31,0.82); backdrop-filter: blur(10px);
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 22px; height: 22px; stroke: var(--gold-bright); fill: none; stroke-width: 1.3; }
  .logo { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0.2px; color: var(--text-cream); }
  header nav { display: flex; gap: 6px; align-items: center; }
  .nav-link {
    font-size: 13.5px; color: var(--text-dim-cream); background: none; border: none;
    padding: 7px 12px; border-radius: 8px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .nav-link:hover { color: var(--text-cream); background: rgba(201,161,90,0.09); }

  main { max-width: 580px; margin: 0 auto; padding: 28px 18px; }
  .hidden { display: none !important; }

  input, textarea, select {
    width: 100%; padding: 11px 13px; border-radius: 8px;
    border: 1px solid rgba(201,161,90,0.25); background: rgba(255,255,255,0.03);
    color: var(--text-cream); font-size: 14.5px; margin-bottom: 11px; font-family: 'Inter', sans-serif;
  }
  input::placeholder, textarea::placeholder { color: var(--text-dim-cream); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.05); }
  textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
  select { color: var(--text-cream); }
  select option { background: var(--ink-2); color: var(--text-cream); }

  button {
    cursor: pointer; border: none; border-radius: 8px;
    padding: 10px 18px; font-weight: 600; font-size: 13.5px;
    background: var(--gold); color: #241a0f; font-family: 'Inter', sans-serif;
    transition: filter 0.15s, transform 0.1s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(0.98); }
  button.ghost { background: transparent; color: var(--text-dim-cream); border: 1px solid rgba(201,161,90,0.3); }
  button.ghost:hover { color: var(--text-cream); border-color: var(--gold); }
  button.danger { background: var(--danger); color: #fbeaea; }
  button.small { padding: 6px 12px; font-size: 12.5px; }

  .auth-wrap { max-width: 380px; margin: 60px auto 20px; text-align: center; }
  .auth-wrap .brand { justify-content: center; margin-bottom: 6px; }
  .auth-tagline { color: var(--text-dim-cream); font-size: 13.5px; margin-bottom: 28px; line-height: 1.5; }
  .auth-box {
    background: var(--parchment); border: 1px solid var(--gold);
    border-radius: 4px; padding: 30px 26px; text-align: left;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .auth-box h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 21px; color: var(--text-ink); margin-bottom: 18px; }
  .auth-box input { background: #fff; border: 1px solid #d9c9a8; color: var(--text-ink); }
  .auth-box input::placeholder { color: #9a8a76; }
  .auth-box button { width: 100%; }
  .auth-switch { text-align: center; margin-top: 14px; font-size: 13px; color: var(--text-dim-ink); }
  .auth-switch a { color: var(--wine); font-weight: 600; }
  .error-msg { color: var(--danger); font-size: 13px; margin-bottom: 12px; }
  .success-msg { color: #3f7a4f; font-size: 13px; margin-bottom: 12px; }

  .categories { display: flex; gap: 7px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 2px; }
  .cat-pill {
    padding: 7px 13px; border-radius: 7px; font-size: 13px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(201,161,90,0.2); color: var(--text-dim-cream);
    white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: all 0.15s;
  }
  .cat-pill .icon { width: 13px; height: 13px; }
  .cat-pill.active { background: var(--gold); color: #241a0f; border-color: var(--gold); }
  .cat-pill.active svg { stroke: #241a0f; }

  .new-post {
    background: rgba(255,255,255,0.035); border: 1px solid rgba(201,161,90,0.2);
    border-radius: 10px; padding: 16px; margin-bottom: 26px;
  }
  .new-post-row { display: flex; gap: 8px; align-items: center; }
  .new-post select { width: auto; flex-shrink: 0; margin-bottom: 0; }
  .new-post button { flex-shrink: 0; margin-left: auto; }

  .post-card {
    background: var(--parchment);
    background-image: linear-gradient(180deg, var(--parchment), var(--parchment-2));
    border: 1px solid var(--gold);
    border-radius: 3px; padding: 18px 18px 14px; margin-bottom: 18px;
    color: var(--text-ink);
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
  }
  .post-card::before, .post-card::after {
    content: ''; position: absolute; width: 9px; height: 9px;
    border: 1px solid var(--gold); opacity: 0.55;
  }
  .post-card::before { top: 7px; left: 7px; border-right: none; border-bottom: none; }
  .post-card::after { bottom: 7px; right: 7px; border-left: none; border-top: none; }

  .post-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .post-user { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--ink); border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; color: var(--gold-bright);
  }
  .username { font-weight: 600; font-size: 14px; color: var(--text-ink); }
  .post-meta { font-size: 11.5px; color: var(--text-dim-ink); }
  .cat-tag {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    background: rgba(124,45,66,0.1); color: var(--wine); font-weight: 600;
    display: flex; align-items: center; gap: 4px;
  }
  .cat-tag .icon { width: 11px; height: 11px; stroke: var(--wine); }
  .post-content { font-size: 14.5px; line-height: 1.6; margin: 10px 0 12px; white-space: pre-wrap; color: var(--text-ink); }
  .post-actions { display: flex; gap: 20px; margin-top: 6px; border-top: 1px solid rgba(124,45,66,0.12); padding-top: 10px; }
  .action-btn {
    background: none; border: none; color: var(--text-dim-ink);
    font-size: 13px; display: flex; align-items: center; gap: 6px; padding: 2px 0;
    font-family: 'Inter', sans-serif; font-weight: 500;
  }
  .action-btn .icon { stroke: var(--text-dim-ink); }
  .action-btn.liked { color: var(--wine); }
  .action-btn.liked .icon { stroke: var(--wine); fill: var(--wine); }
  .action-btn:hover { color: var(--text-ink); }
  .action-btn:hover .icon { stroke: var(--text-ink); }

  .comments-box { margin-top: 12px; border-top: 1px solid rgba(124,45,66,0.12); padding-top: 12px; }
  .comment { font-size: 13px; margin-bottom: 9px; padding-bottom: 9px; border-bottom: 1px dashed rgba(124,45,66,0.15); color: var(--text-ink); }
  .comment b { color: var(--wine); font-weight: 600; }
  .comment-input-row { display: flex; gap: 6px; margin-top: 10px; }
  .comment-input-row input { margin-bottom: 0; background: #fff; border: 1px solid #d9c9a8; color: var(--text-ink); }

  .profile-header {
    background: rgba(255,255,255,0.035); border: 1px solid rgba(201,161,90,0.25);
    border-radius: 10px; padding: 26px 20px; margin-bottom: 24px; text-align: center;
  }
  .profile-header .avatar { width: 60px; height: 60px; font-size: 22px; margin: 0 auto 12px; }
  .profile-header .display-name { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 500; color: var(--text-cream); }
  .profile-stats { display: flex; justify-content: center; gap: 28px; margin-top: 16px; font-size: 12.5px; color: var(--text-dim-cream); }
  .profile-stats b { color: var(--text-cream); display: block; font-size: 17px; font-family: 'Fraunces', serif; font-weight: 500; }

  .empty-state { text-align: center; color: var(--text-dim-cream); padding: 50px 20px; font-size: 14px; line-height: 1.6; }
  .empty-state svg { width: 28px; height: 28px; stroke: var(--gold); opacity: 0.6; margin-bottom: 12px; }
  .loading { text-align: center; padding: 40px; color: var(--text-dim-cream); font-size: 13.5px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,8,17,0.75);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-box {
    background: var(--parchment); border: 1px solid var(--gold);
    border-radius: 4px; padding: 22px; max-width: 340px; width: 100%;
    color: var(--text-ink);
  }
  .modal-box h3 { font-family: 'Fraunces', serif; font-weight: 500; margin-bottom: 14px; font-size: 17px; }
  .modal-box input, .modal-box textarea, .modal-box select { background: #fff; border: 1px solid #d9c9a8; color: var(--text-ink); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 8.5 12 7 7 0 0 1-8.5-12z"/><path d="M17 3l.6 1.6L19 5l-1.4.6L17 7l-.6-1.4L15 5l1.4-.4z"/></svg>
    <span class="logo">AstroChat</span>
  </div>
  <nav id="navAuthed" class="hidden">
    <button class="nav-link" onclick="showView('feed')">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v9h14v-9"/></svg>Akış
    </button>
    <button class="nav-link" onclick="showView('profile')">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg>Profilim
    </button>
    <button class="nav-link" onclick="logout()">Çıkış</button>
  </nav>
</header>

<main>

  <!-- AUTH VIEW -->
  <div id="view-auth">
    <div class="auth-wrap">
      <div class="brand">
        <svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke:#e3c483;fill:none;stroke-width:1.3"><path d="M12 3a9 9 0 1 0 8.5 12 7 7 0 0 1-8.5-12z"/></svg>
        <span class="logo" style="font-size:26px">AstroChat</span>
      </div>
      <p class="auth-tagline">Yargılanmadan sohbet edebileceğin, astroloji ve tarot dünyasına gerçekten ilgi duyan insanların bir araya geldiği yer.</p>
      <div class="auth-box">
        <h2 id="authTitle">Giriş Yap</h2>
        <div id="authError" class="error-msg hidden"></div>
        <div id="authSuccess" class="success-msg hidden"></div>
        <input id="authEmail" type="email" placeholder="E-posta">
        <input id="authPassword" type="password" placeholder="Şifre">
        <button onclick="handleAuth()" id="authBtn">Giriş Yap</button>
        <div class="auth-switch">
          <span id="authSwitchText">Hesabın yok mu?</span>
          <a href="#" onclick="toggleAuthMode(); return false;" id="authSwitchLink">Kayıt ol</a>
        </div>
      </div>
    </div>
  </div>

  <!-- FEED VIEW -->
  <div id="view-feed" class="hidden">
    <div class="categories">
      <div class="cat-pill active" data-cat="all" onclick="filterCategory('all')">Hepsi</div>
      <div class="cat-pill" data-cat="astroloji" onclick="filterCategory('astroloji')"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 8.5 12 7 7 0 0 1-8.5-12z"/></svg>Astroloji</div>
      <div class="cat-pill" data-cat="tarot" onclick="filterCategory('tarot')"><svg class="icon" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M12 8v8M9 12h6"/></svg>Tarot</div>
      <div class="cat-pill" data-cat="ruya" onclick="filterCategory('ruya')"><svg class="icon" viewBox="0 0 24 24"><path d="M4 17c2-4 5-4 6-1s4 3 6-1 4-2 4-2"/><circle cx="18" cy="6" r="1.2"/><circle cx="20" cy="9" r="0.8"/></svg>Rüya</div>
      <div class="cat-pill" data-cat="genel" onclick="filterCategory('genel')"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>Genel</div>
    </div>

    <div class="new-post">
      <textarea id="newPostContent" placeholder="Bir rüyanı, tarot açılımını ya da astrolojik gözlemini paylaş..."></textarea>
      <div class="new-post-row">
        <select id="newPostCategory">
          <option value="genel">Genel</option>
          <option value="astroloji">Astroloji</option>
          <option value="tarot">Tarot</option>
          <option value="ruya">Rüya</option>
        </select>
        <button onclick="createPost()">Paylaş</button>
      </div>
    </div>

    <div id="postsContainer">
      <div class="loading">Yükleniyor...</div>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="view-profile" class="hidden">
    <div class="profile-header">
      <div class="avatar" id="profileAvatar">?</div>
      <div class="display-name" id="profileUsername"></div>
      <div id="profileBurc" style="color:var(--text-dim-cream); font-size:13px; margin-top:5px;"></div>
      <div class="profile-stats">
        <div><b id="statPosts">0</b>Post</div>
        <div><b id="statFollowers">0</b>Takipçi</div>
        <div><b id="statFollowing">0</b>Takip</div>
      </div>
      <button class="ghost small" style="margin-top:16px" onclick="openEditProfile()">Profili Düzenle</button>
    </div>
    <div id="myPostsContainer"></div>
  </div>

  <!-- REPORT MODAL -->
  <div id="reportModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Bu paylaşımı şikayet et</h3>
      <select id="reportReason">
        <option value="asagilama">Aşağılama / alaycı içerik</option>
        <option value="spam">Spam</option>
        <option value="uygunsuz">Uygunsuz içerik</option>
        <option value="diger">Diğer</option>
      </select>
      <div class="modal-actions">
        <button class="ghost small" onclick="closeReportModal()">Vazgeç</button>
        <button class="danger small" onclick="submitReport()">Şikayet Et</button>
      </div>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div id="editProfileModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Profili Düzenle</h3>
      <input id="editUsername" placeholder="Kullanıcı adı">
      <select id="editBurc">
        <option value="">Burç seç</option>
        <option>Koç</option><option>Boğa</option><option>İkizler</option><option>Yengeç</option>
        <option>Aslan</option><option>Başak</option><option>Terazi</option><option>Akrep</option>
        <option>Yay</option><option>Oğlak</option><option>Kova</option><option>Balık</option>
      </select>
      <textarea id="editBio" placeholder="Kendinden bahset..."></textarea>
      <div class="modal-actions">
        <button class="ghost small" onclick="closeEditProfile()">Vazgeç</button>
        <button class="small" onclick="saveProfile()">Kaydet</button>
      </div>
    </div>
  </div>

</main>

<script>
// ============================================
// SUPABASE BAĞLANTISI
// ============================================
const SUPABASE_URL = 'https://lqpjnwdaotrsjxaqgjus.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_eQhNPsI_YqBAT_zuTKI2qA_Ku0KUL7W';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;
let activeCategory = 'all';
let reportTargetPostId = null;

// ============================================
// ICONS
// ============================================
const ICONS = {
  heart: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.5-9C1 7.5 3 4 6.5 4 9 4 11 6 12 7.5 13 6 15 4 17.5 4 21 4 23 7.5 21.5 11 19 15.6 12 20 12 20z"/></svg>',
  heartFilled: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.5-9C1 7.5 3 4 6.5 4 9 4 11 6 12 7.5 13 6 15 4 17.5 4 21 4 23 7.5 21.5 11 19 15.6 12 20 12 20z"/></svg>',
  comment: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  flag: '<svg class="icon" viewBox="0 0 24 24"><path d="M5 3v18M5 4h11l-2.5 3.5L16 11H5"/></svg>',
  moon: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 8.5 12 7 7 0 0 1-8.5-12z"/></svg>',
  sparkle: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 17c2-4 5-4 6-1s4 3 6-1 4-2 4-2"/><circle cx="18" cy="6" r="1.2"/><circle cx="20" cy="9" r="0.8"/></svg>',
  card: '<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M12 8v8M9 12h6"/></svg>',
  chat: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  compass: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6z"/></svg>'
};

// ============================================
// AUTH
// ============================================
let authMode = 'login'; // 'login' | 'signup'

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authTitle').textContent = authMode === 'login' ? 'Giriş Yap' : 'Kayıt Ol';
  document.getElementById('authBtn').textContent = authMode === 'login' ? 'Giriş Yap' : 'Kayıt Ol';
  document.getElementById('authSwitchText').textContent = authMode === 'login' ? 'Hesabın yok mu?' : 'Zaten hesabın var mı?';
  document.getElementById('authSwitchLink').textContent = authMode === 'login' ? 'Kayıt ol' : 'Giriş yap';
  hideAuthMsgs();
}

function hideAuthMsgs() {
  document.getElementById('authError').classList.add('hidden');
  document.getElementById('authSuccess').classList.add('hidden');
}

async function handleAuth() {
  hideAuthMsgs();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { showAuthError('E-posta ve şifre gerekli.'); return; }
  if (password.length < 6) { showAuthError('Şifre en az 6 karakter olmalı.'); return; }

  if (authMode === 'signup') {
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) { showAuthError(error.message); return; }
    if (data.session) {
      await onLoginSuccess();
    } else {
      document.getElementById('authSuccess').textContent = 'Kayıt başarılı! E-postanı kontrol edip onayladıktan sonra giriş yapabilirsin.';
      document.getElementById('authSuccess').classList.remove('hidden');
    }
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showAuthError('E-posta veya şifre hatalı.'); return; }
    await onLoginSuccess();
  }
}

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.remove('hidden');
}

async function logout() {
  await sb.auth.signOut();
  currentUser = null;
  currentProfile = null;
  document.getElementById('navAuthed').classList.add('hidden');
  showView('auth');
}

async function onLoginSuccess() {
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  await loadMyProfile();
  document.getElementById('navAuthed').classList.remove('hidden');
  showView('feed');
  loadFeed();
}

async function loadMyProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if (data) currentProfile = data;
}

// ============================================
// VIEW SWITCHING
// ============================================
function showView(name) {
  ['auth', 'feed', 'profile'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('hidden', v !== name);
  });
  if (name === 'profile') loadProfileView();
}

// ============================================
// FEED
// ============================================
function filterCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.cat-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.cat === cat);
  });
  loadFeed();
}

async function loadFeed() {
  const container = document.getElementById('postsContainer');
  container.innerHTML = '<div class="loading">Yükleniyor...</div>';

  let query = sb.from('posts').select('*, profiles(username, avatar_url), likes(user_id), comments(id, content, created_at, profiles(username))').order('created_at', { ascending: false }).limit(50);
  if (activeCategory !== 'all') query = query.eq('category', activeCategory);

  const { data: posts, error } = await query;
  if (error) {
    container.innerHTML = '<div class="empty-state">Bir hata oluştu: ' + error.message + '</div>';
    return;
  }
  if (!posts || posts.length === 0) {
    container.innerHTML = '<div class="empty-state">' + ICONS.moon + '<div>Henüz paylaşım yok.<br>İlk paylaşımı sen yap.</div></div>';
    return;
  }
  container.innerHTML = posts.map(renderPostCard).join('');
}

const catLabels = { astroloji: 'Astroloji', tarot: 'Tarot', ruya: 'Rüya', genel: 'Genel' };
const catIcons = { astroloji: ICONS.moon, tarot: ICONS.card, ruya: ICONS.sparkle, genel: ICONS.chat };

function renderPostCard(post) {
  const username = post.profiles?.username || 'Bilinmeyen';
  const initial = username.charAt(0).toUpperCase();
  const liked = post.likes?.some(l => l.user_id === currentUser?.id);
  const likeCount = post.likes?.length || 0;
  const comments = post.comments || [];
  const timeAgo = formatTimeAgo(post.created_at);

  return `
    <div class="post-card">
      <div class="post-head">
        <div class="post-user">
          <div class="avatar">${initial}</div>
          <div>
            <div class="username">${escapeHtml(username)}</div>
            <div class="post-meta">${timeAgo}</div>
          </div>
        </div>
        <span class="cat-tag">${catIcons[post.category] || ''}${catLabels[post.category] || post.category}</span>
      </div>
      <div class="post-content">${escapeHtml(post.content)}</div>
      <div class="post-actions">
        <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${post.id}', ${liked})">
          ${liked ? ICONS.heartFilled : ICONS.heart} <span>${likeCount}</span>
        </button>
        <button class="action-btn" onclick="toggleComments('${post.id}')">${ICONS.comment} <span>${comments.length}</span></button>
        <button class="action-btn" onclick="openReportModal('${post.id}')">${ICONS.flag}</button>
      </div>
      <div class="comments-box hidden" id="comments-${post.id}">
        ${comments.map(c => `<div class="comment"><b>${escapeHtml(c.profiles?.username || '?')}</b>  ${escapeHtml(c.content)}</div>`).join('') || '<div class="comment" style="color:var(--text-dim-ink)">Henüz yorum yok.</div>'}
        <div class="comment-input-row">
          <input id="commentInput-${post.id}" placeholder="Yorum yaz...">
          <button class="small" onclick="addComment('${post.id}')">Gönder</button>
        </div>
      </div>
    </div>
  `;
}

function toggleComments(postId) {
  document.getElementById('comments-' + postId).classList.toggle('hidden');
}

async function toggleLike(postId, currentlyLiked) {
  if (currentlyLiked) {
    await sb.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
  } else {
    await sb.from('likes').insert({ post_id: postId, user_id: currentUser.id });
  }
  loadFeed();
}

async function addComment(postId) {
  const input = document.getElementById('commentInput-' + postId);
  const content = input.value.trim();
  if (!content) return;
  const { error } = await sb.from('comments').insert({ post_id: postId, user_id: currentUser.id, content });
  if (!error) { input.value = ''; loadFeed(); }
}

async function createPost() {
  const content = document.getElementById('newPostContent').value.trim();
  const category = document.getElementById('newPostCategory').value;
  if (!content) return;
  const { error } = await sb.from('posts').insert({ user_id: currentUser.id, content, category });
  if (!error) { document.getElementById('newPostContent').value = ''; loadFeed(); }
  else { alert('Paylaşım gönderilemedi: ' + error.message); }
}

// ============================================
// REPORT
// ============================================
function openReportModal(postId) {
  reportTargetPostId = postId;
  document.getElementById('reportModal').classList.remove('hidden');
}
function closeReportModal() {
  document.getElementById('reportModal').classList.add('hidden');
  reportTargetPostId = null;
}
async function submitReport() {
  const reason = document.getElementById('reportReason').value;
  await sb.from('reports').insert({ reporter_id: currentUser.id, post_id: reportTargetPostId, reason });
  closeReportModal();
  alert('Şikayetin alındı, teşekkürler.');
}

// ============================================
// PROFILE
// ============================================
async function loadProfileView() {
  await loadMyProfile();
  if (!currentProfile) return;
  document.getElementById('profileAvatar').textContent = currentProfile.username.charAt(0).toUpperCase();
  document.getElementById('profileUsername').textContent = currentProfile.display_name || currentProfile.username;
  document.getElementById('profileBurc').textContent = currentProfile.burc ? currentProfile.burc : 'Burç belirtilmemiş';

  const { count: postCount } = await sb.from('posts').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);
  const { count: followerCount } = await sb.from('follows').select('*', { count: 'exact', head: true }).eq('following_id', currentUser.id);
  const { count: followingCount } = await sb.from('follows').select('*', { count: 'exact', head: true }).eq('follower_id', currentUser.id);
  document.getElementById('statPosts').textContent = postCount || 0;
  document.getElementById('statFollowers').textContent = followerCount || 0;
  document.getElementById('statFollowing').textContent = followingCount || 0;

  const { data: myPosts } = await sb.from('posts').select('*, profiles(username, avatar_url), likes(user_id), comments(id, content, created_at, profiles(username))').eq('user_id', currentUser.id).order('created_at', { ascending: false });
  const container = document.getElementById('myPostsContainer');
  container.innerHTML = (myPosts && myPosts.length) ? myPosts.map(renderPostCard).join('') : '<div class="empty-state">Henüz paylaşımın yok.</div>';
}

function openEditProfile() {
  document.getElementById('editUsername').value = currentProfile.username || '';
  document.getElementById('editBurc').value = currentProfile.burc || '';
  document.getElementById('editBio').value = currentProfile.bio || '';
  document.getElementById('editProfileModal').classList.remove('hidden');
}
function closeEditProfile() {
  document.getElementById('editProfileModal').classList.add('hidden');
}
async function saveProfile() {
  const username = document.getElementById('editUsername').value.trim();
  const burc = document.getElementById('editBurc').value;
  const bio = document.getElementById('editBio').value.trim();
  if (!username) { alert('Kullanıcı adı boş olamaz.'); return; }
  const { error } = await sb.from('profiles').update({ username, burc, bio }).eq('id', currentUser.id);
  if (error) { alert('Güncellenemedi: ' + error.message); return; }
  closeEditProfile();
  loadProfileView();
}

// ============================================
// HELPERS
// ============================================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTimeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if (diff < 60) return 'az önce';
  if (diff < 3600) return Math.floor(diff / 60) + ' dk önce';
  if (diff < 86400) return Math.floor(diff / 3600) + ' sa önce';
  return Math.floor(diff / 86400) + ' gün önce';
}

// ============================================
// INIT
// ============================================
(async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    await loadMyProfile();
    document.getElementById('navAuthed').classList.remove('hidden');
    showView('feed');
    loadFeed();
  } else {
    showView('auth');
  }
})();
</script>
